[project]
name = "kwja"
version = "2.5.1"
description = "A unified Japanese analyzer based on foundation models"
license = "MIT"
authors = [
    { name = "Hirokazu Kiyomaru", email = "kiyomaru@i.kyoto-u.ac.jp" },
    { name = "Nobuhiro Ueda", email = "ueda@nlp.i.kyoto-u.ac.jp" },
    { name = "Kazumasa Omura", email = "omura@nlp.i.kyoto-u.ac.jp" },
    { name = "Takashi Kodama", email = "kodama@nlp.i.kyoto-u.ac.jp" },
    { name = "Yugo Murawaki", email = "murawaki@i.kyoto-u.ac.jp" },
    { name = "Daisuke Kawahara", email = "dkw@waseda.jp" },
    { name = "Sadao Kurohashi", email = "kuro@i.kyoto-u.ac.jp" }
]
maintainers = [
    { name = "Hirokazu Kiyomaru", email = "kiyomaru@i.kyoto-u.ac.jp" },
    { name = "Nobuhiro Ueda", email = "ueda@nlp.i.kyoto-u.ac.jp" },
    { name = "Kazumasa Omura", email = "omura@nlp.i.kyoto-u.ac.jp" },
    { name = "Takashi Kodama", email = "kodama@nlp.i.kyoto-u.ac.jp" },
    { name = "Yugo Murawaki", email = "murawaki@i.kyoto-u.ac.jp" },
]
readme = "README.md"
keywords = ["NLP", "Japanese"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Japanese",
    "Environment :: GPU",
    "Environment :: Console",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing",
]
requires-python = ">=3.11,<3.15"

dependencies = [
    "torch>=2.12.0,<2.15.0",
    "numpy>=2.4.0,<2.5.0",
    "transformers[sentencepiece]>=5.16.1,<5.17.0",
    "tokenizers>=0.22.0,<0.24.0",
    "lightning>=2.6.0,<2.7.0",
    "omegaconf>=2.3.1,<2.4.0",
    "hydra-core>=1.3.6,<1.4.0",
    "rhoknp>=1.7",
    "typer-slim>=0.24.0,<0.25.0",
    "jinf>=1.0.4",
    # pure-cdb 4.x publishes manylinux x86_64 wheels only, and building its C extension from
    # the sdist fails on Windows (setuptools cannot detect a modern MSVC install). Fall back to
    # the last pure-Python release there; everywhere else keep 4.x and its accelerated hashing.
    "pure-cdb>=4.0; sys_platform != 'win32'",
    "pure-cdb==3.1.0; sys_platform == 'win32'",
    "rich>=15.0.0,<16.0.0",
    "pyyaml>=6.0",
    "regex>=2024.7.24",
    "cohesion-tools>=0.7.5,<0.8.0",
    "huggingface-hub>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/ku-nlp/kwja"
Repository = "https://github.com/ku-nlp/kwja"
Issues = "https://github.com/ku-nlp/kwja/issues"
Changelog = "https://github.com/ku-nlp/kwja/blob/main/CHANGELOG.md"

[project.scripts]
kwja = "kwja.cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "cohesion-tools[eval]>=0.7.5,<0.8.0",
    "jaconv>=0.5.0,<0.6.0",
    "levenshtein>=0.26.0",
    "python-dotenv>=1.0",
    "ruff",
    "scikit-learn>=1.6",
    "seqeval>=1.2",
    "torchmetrics>=1.0",
    "ty",
    "types-attrs>=19.1",
    "types-pyyaml>=6.0.12",
    "wandb>=0.29.0",
]
test = [
    "cohesion-tools[eval]>=0.7.5,<0.8.0",
    "jaconv>=0.5.0,<0.6.0",
    "levenshtein>=0.26.0",
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "pytest-profiling>=1.7",
    "seqeval>=1.2",
    "torchmetrics>=1.0",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "/src/kwja/metrics",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kwja"]
exclude = [
    "/src/kwja/metrics",
]


[tool.ruff]
line-length = 120
indent-width = 4
src = ["src"]
target-version = "py311"  # The minimum Python version to target

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "PL", "PD", "NPY", "RUF", "UP", "TID", "COM", "PT", "ARG", "PYI", "FA", "G", "FBT", "ANN", "S"]
ignore = [
    "E501",  # Line too long
    "PLR0911",  # Too many return statements
    "PLR0912",  # Too many branches
    "PLR0913",  # Too many arguments in function definition
    "PLR0915",  # Too many statements
    "ANN002",  # Missing type annotation for `*args`
    "ANN003",  # Missing type annotation for `**kwargs`
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed in `...`
    "RUF001",  # String contains ambiguous `...` (...). Did you mean `...` (...)?
    "RUF002",  # Docstring contains ambiguous `...` (...). Did you mean `...` (...)?
    "RUF003",  # Comment contains ambiguous `...` (...). Did you mean `...` (...)?
    "UP037",  # Remove quotes from type annotation
    "COM812",  # Trailing comma missing
    "PLR2004",  # Magic value used in comparison
    "PT018",  # Assertion should be broken down into multiple parts
    "FA100",  # Missing `from __future__ import annotations`, but uses `...`
    "G004",  # Logging statement uses f-string
    "FBT001",  # Boolean-typed positional argument in function definition
    "FBT002",  # Boolean default positional argument in function definition
    "FBT003",  # Boolean positional value in function call
]

[tool.ruff.lint.per-file-ignores]
"src/kwja/modules/components/deberta_v2.py" = [
    "PLW0127",  # Self-assignment of variable `...`
    "ANN",  # flake8-annotations
    "RUF005",  # Consider iterable unpacking instead of concatenation
    "UP045",  # Use `X | None` for type annotations
]
"src/kwja/metrics/conll18_ud_eval.py" = [
    "PT027",  # Use `pytest.raises` instead of unittest-style `assertRaises`
    "B023",  # Function definition does not bind loop variable `sentence_start`
    "B904",  # Within an `except` clause, raise exceptions with `raise ... from err` or `raise ... from None` to distinguish them from errors in exception handling
    "ANN",  # flake8-annotations
]
"tests/*" = [
    "D",  # pydocstyle
    "S101",  # Test assertions
    "S311",  # Standard pseudo-random generators are not suitable for cryptographic purposes
    "INP001",  # File `...` is part of an implicit namespace package. Add an `__init__.py`
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 20  # default: 10

[tool.ruff.lint.pylint]
max-positional-args = 10  # default: 5

[tool.ty.src]
exclude = ["tests", "src/kwja/modules/components/deberta_v2.py", "src/kwja/metrics/conll18_ud_eval.py"]

[tool.ty.rules]
unresolved-attribute = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # note the use of single quote below to denote "raw" strings in TOML
    'ignore::UserWarning',
    'ignore:`torch\.jit\.script` is deprecated\.:DeprecationWarning:torch\.jit\._script',
    'ignore:`isinstance\(treespec, LeafSpec\)` is deprecated:FutureWarning:lightning\.pytorch\.utilities\._pytree',
]
