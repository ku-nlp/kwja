ci:
  autofix_prs: false
  autoupdate_branch: dev
  autoupdate_schedule: monthly
  skip: [ty]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        exclude: "kwja/resource/.*"
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uvx ty check
        language: python
        language_version: python3.12
        pass_filenames: false
        additional_dependencies:
          - ty
          - numpy<2.5
          - rhoknp==1.8.0
          - hydra-core==1.3.2
          - lightning>=2.5.0,<2.6.0
          - torch==2.7.1
          - torchmetrics==1.8.2
          - transformers==4.55.4
          - tokenizers
          - python-dotenv
          - pure-cdb>=4.0
          - jinf>=1.0.4
          - jaconv
          - Levenshtein
          - pytest
          - seqeval
          - scikit-learn
          - pandas
          - wandb
          - rich>=14.0.0,<15.0.0
          - typer-slim
          - types-click
          - types-PyYAML
          - cohesion-tools==0.7.6
  -   repo: https://github.com/shellcheck-py/shellcheck-py
      rev: v0.11.0.1
      hooks:
        - id: shellcheck
          files: ^scripts/
          types: [ shell ]
          args: [ --exclude=SC2002 ]
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.9
    hooks:
      - id: actionlint
