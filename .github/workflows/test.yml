name: Test

on: [ push, pull_request ]

jobs:
  test:
    name: Run tests with pytest
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 12
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.9", "3.10", "3.11", "3.12" ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: |
            pipx install poetry
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install dependencies (with torch cpu version)
        run: |
          poetry install --no-interaction --without dev --no-cache
          torch_version="$(poetry run pip show torch | grep Version | cut -d' ' -f2)"
          poetry run pip uninstall -y torch
          poetry run pip install torch=="$torch_version" --index-url https://download.pytorch.org/whl/cpu
      - name: Run tests with coverage
        if: ${{ matrix.python-version == 3.11 && matrix.os == 'ubuntu-latest' }}
        run: |
          poetry run pytest --cov=./ --cov-report=xml -v ./tests
      - name: Run tests without coverage
        if: ${{ matrix.python-version != 3.11 || matrix.os != 'ubuntu-latest' }}
        run: |
          poetry run pytest -v ./tests
      - name: Upload coverage to Codecov
        if: ${{ matrix.python-version == 3.11 && matrix.os == 'ubuntu-latest' }}
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  test-cli:
    name: Install KWJA from pip and run CLI
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 12
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.9", "3.10", "3.11", "3.12" ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install KWJA from pip
        run: pip3 install .
      - name: Run CLI
        run: |
          kwja --version
          kwja --help
