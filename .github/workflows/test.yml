name: Test

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    name: Run tests with pytest
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 15
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Install dependencies
        run: |
          uv sync --no-cache --no-dev --group test
      - name: Create config file (Unix/Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p ~/.config/kwja
          cat > ~/.config/kwja/config.yaml << 'EOF'
          model_size: tiny
          device: cpu
          num_workers: 0
          torch_compile: false
          typo_batch_size: 1
          char_batch_size: 1
          seq2seq_batch_size: 1
          word_batch_size: 1
          EOF
      - name: Create config file (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.config\kwja"
          @"
          model_size: tiny
          device: cpu
          num_workers: 0
          torch_compile: false
          typo_batch_size: 1
          char_batch_size: 1
          seq2seq_batch_size: 1
          word_batch_size: 1
          "@ | Set-Content -Path "$env:USERPROFILE\.config\kwja\config.yaml"
        shell: pwsh
      - name: Run tests with coverage
        if: ${{ matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest' }}
        run: |
          uv run --frozen --no-dev --group test pytest --cov=./ --cov-report=xml -v ./tests
      - name: Run tests without coverage (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          $env:PYTHONUTF8 = "1"
          uv run --frozen --no-dev --group test pytest -v ./tests
        shell: pwsh
      - name: Run tests without coverage (non-Windows)
        if: ${{ (matrix.python-version != '3.11' || matrix.os != 'ubuntu-latest') && matrix.os != 'windows-latest' }}
        run: |
          uv run --frozen --no-dev --group test pytest -v ./tests
      - name: Upload coverage to Codecov
        if: ${{ matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest' }}
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  test-cli:
    name: Install KWJA with uv and run CLI
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 15
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Run CLI
        run: |
          uv run --isolated --no-project --python "${{ matrix.python-version }}" --with . kwja --version
          uv run --isolated --no-project --python "${{ matrix.python-version }}" --with . kwja --help
