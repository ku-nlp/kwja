name: Test

on: [ push, pull_request ]

jobs:
  test:
    name: Run tests with pytest
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 12
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.9", "3.10", "3.11", "3.12" ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: |
          poetry install --no-interaction --without dev --no-cache
      - name: Create config file (Unix/Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p ~/.config/kwja
          cat > ~/.config/kwja/config.yaml << 'EOF'
          model_size: tiny
          device: cpu
          num_workers: 0
          torch_compile: false
          typo_batch_size: 1
          char_batch_size: 1
          seq2seq_batch_size: 1
          word_batch_size: 1
          EOF
      - name: Create config file (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.config\kwja"
          @"
          model_size: tiny
          device: cpu
          num_workers: 0
          torch_compile: false
          typo_batch_size: 1
          char_batch_size: 1
          seq2seq_batch_size: 1
          word_batch_size: 1
          "@ | Set-Content -Path "$env:USERPROFILE\.config\kwja\config.yaml"
        shell: pwsh
      - name: Run tests with coverage
        if: ${{ matrix.python-version == 3.11 && matrix.os == 'ubuntu-latest' }}
        run: |
          poetry run pytest --cov=./ --cov-report=xml -v ./tests
      - name: Run tests without coverage (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          $env:PYTHONUTF8 = "1"
          poetry run pytest -v ./tests
        shell: pwsh
      - name: Run tests without coverage (non-Windows)
        if: ${{ (matrix.python-version != 3.11 || matrix.os != 'ubuntu-latest') && matrix.os != 'windows-latest' }}
        run: |
          poetry run pytest -v ./tests
      - name: Upload coverage to Codecov
        if: ${{ matrix.python-version == 3.11 && matrix.os == 'ubuntu-latest' }}
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  test-cli:
    name: Install KWJA from pip and run CLI
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 12
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.9", "3.10", "3.11", "3.12" ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install KWJA from pip
        run: pip3 install .
      - name: Run CLI
        run: |
          kwja --version
          kwja --help
