name: Build

on: [ push, pull_request ]

jobs:
  build:
    name: Build the project
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 15
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Build package
        run: |
          uv build
      - name: Create virtual environment
        run: |
          uv venv --python "${{ matrix.python-version }}" .venv
      - name: Install KWJA from wheel (non-Windows)
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          uv pip install --python .venv dist/*.whl
      - name: Install KWJA from wheel (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          $wheelFile = (Get-ChildItem -Path dist -Filter *.whl).FullName
          uv pip install --python .venv "${wheelFile}"
        shell: pwsh
      - name: Run KWJA (Ubuntu)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          .venv/bin/kwja --version
          .venv/bin/kwja --help
          .venv/bin/kwja --tasks typo,char,word --model-size tiny --text "自然言語処理"
          .venv/bin/kwja --tasks typo,char,seq2seq,word --model-size tiny --text "自然言語処理"
      - name: Run KWJA (macOS)
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          .venv/bin/kwja --version
          .venv/bin/kwja --help
          .venv/bin/kwja --tasks typo,char,word --model-size tiny --text "自然言語処理" --device cpu  # avoid OOM
          .venv/bin/kwja --tasks typo,char,seq2seq,word --model-size tiny --text "自然言語処理" --device cpu  # avoid OOM
      - name: Run KWJA (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          $env:PYTHONUTF8 = "1"
          .\.venv\Scripts\kwja --version
          .\.venv\Scripts\kwja --help
          .\.venv\Scripts\kwja --tasks typo,char,word --model-size tiny --text "自然言語処理"
          .\.venv\Scripts\kwja --tasks typo,char,seq2seq,word --model-size tiny --text "自然言語処理"
        shell: pwsh
